[project]
name = "agenticmemoryproject"
version = "0.1.0"
description = "Scientific benchmarking framework: Vector RAG vs GraphRAG token efficiency"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyyaml>=6.0,<7",
    "litellm[proxy]>=1.82,<2",
    "networkx>=3.0",
    "numpy>=1.26.4",
    "datasets>=3.0,<4",
    "chromadb-client>=1.0",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.2.2",
    "graphrag>=2.6,<3",
    "jinja2>=3.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires live LLM endpoints (deselect with -m 'not integration')",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0.0",
]
