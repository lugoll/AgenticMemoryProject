# Experiment-Parameter — wird von den Scripts per yaml.safe_load geladen
# Keine Varianten, keine Vererbung — ein flaches Parameter-File.

llm:
  agent:
    model: "ollama/llama3.1:8b"
    base_url: "http://localhost:11434"
    temperature: 0.0
    max_tokens: 512
  ingest:
    # Gleicher Container wie agent — läuft sequenziell, nie gleichzeitig mit agent/judge.
    # Structured Output via Ollama JSON Schema (llama.cpp grammar-based).
    # 1024 Tokens: max 20 Triples à ~45 Token + Overhead; Fallback-Regex bei Truncation.
    # War 512 → erhöht auf 1024 (2026-05-25): Analyse zeigte dass bei Artikeln mit
    # vielen Entitäten (30+ Gäste, Ensemblefilme) das 10-Triple-Limit zu früh abschnitt.
    # Direkte Auswirkung: ~15 von 24 "in-graph-but-not-returned"-Fällen (50-Fragen-Run).
    model: "ollama/llama3.1:8b"
    base_url: "http://localhost:11434"
    temperature: 0.0
    max_tokens: 1024
  judge:
    # Andere Model-Family als Agent (Qwen vs. Llama) → kein Self-Enhancement-Bias.
    # 14B statt 7B (2026-05-25): 16GB VRAM erlaubt kein gleichzeitiges Laden zweier 14B-Modelle,
    # aber Judge läuft ausschließlich in 04_evaluate.py — sequenziell nach Agent. Mit
    # OLLAMA_KEEP_ALIVE=0 am Judge-Container wird das Agent-Modell vorher entladen.
    # Nutzen: bessere Urteilsqualität bei grenzwertigen Antworten; betrifft alle Varianten gleich.
    model: "ollama/qwen2.5:14b"
    base_url: "http://localhost:11435"
    temperature: 0.0
    max_tokens: 5

# Gerät für alle lokalen Torch-Modelle (Embedder + Cross-Encoder-Reranker).
# "auto" → cuda wenn verfügbar, sonst cpu. Kein LLM-Call, keine API-Kosten —
# betrifft nur die Latenz der lokalen Inferenz.
device: "auto"

embedding:
  # BAAI/bge-base-en-v1.5: MIT-Lizenz, ~400MB, Top-Performer BEIR-Benchmark (2023).
  # Läuft lokal via sentence-transformers (Gerät siehe `device`) — keine API-Kosten.
  model: "BAAI/bge-base-en-v1.5"
  batch_size: 32

retrieval:
  top_k: 5
  similarity_cutoff: 0.5    # 0.5 statt 0.7: Multi-Hop braucht breiteres Netz
  rerank_fetch_k: 30        # vectorrerank: Kandidaten-Pool vor Cross-Encoder-Rerank
                            # (auf graph.rerank_top_n gekürzt); muss > rerank_top_n sein

ingestion:
  chunk_size: 300            # HotpotQA-Paragraphen sind kurz (~100 Wörter)
  chunk_overlap: 50

graph:
  max_hops: 3                # HotpotQA braucht bis zu 3 Hops
  top_k: 10                  # Graph-Triples sind kurz (~8 Wörter) vs. Textpassagen (~50 Wörter)
                             # bei top_k=5 fehlt Hop 2 fast immer im Context
  # Zwei Retrieval-Pfade teilen sich den Store (per Variante als bestes evaluiert):
  #   graph       → flache Hop-für-Hop-BFS (_expand_triples) + Single-Triple-Rerank.
  #                 Hub-Explosion begrenzt durch max_frontier (Entities/Hop) und
  #                 max_candidates (Gesamt-Triples); Cap-Treffer werden geloggt.
  #   vectorgraph → Beam-Pfad-Traversierung (traversal.py): Chains werden ganz
  #                 gescored, ein per-Node-gedeckelter Top-K-Beam behalten.
  max_frontier: 200          # graph: max. Entities pro Hop-Frontier
  max_candidates: 1000       # max. Kandidaten-Triples / per-Hop Cypher-Row-Bound
  beam_width: 10             # vectorgraph: Chains pro Hop
  max_per_tail: 3            # vectorgraph: max. Chains pro Hop je Tail-/Source-Knoten
  # Cross-Encoder-Reranker, geteilt von allen Graph-Varianten (src/memory/reranker.py).
  # Kein LLM-Call → bewahrt die Zero-Cost-Retrieval-Eigenschaft (Gerät siehe `device`).
  rerank_model: "BAAI/bge-reranker-base"
  rerank_top_n: 10           # finale Context-Größe (Anzahl Reasoning-Chains)

# Neo4j ist der einzige Store: Chunks (Volltext- + Vektor-Index) und der
# extrahierte Knowledge Graph liegen in derselben Datenbank — ein Ingest-Lauf
# bedient alle Retrieval-Varianten.
stores:
  neo4j:
    uri: "bolt://localhost:7687"
    username: "neo4j"
    password: "password"
    database: "neo4j"
  chunk_fulltext_index: "chunk_fulltext"   # Lucene BM25 über Chunk.text
  chunk_vector_index: "chunk_vector"       # Cosine-HNSW über Chunk.embedding

telemetry:
  output_dir: "evaluations/"
