services:

  # ── Vector store ─────────────────────────────────────────────────────────────
  # ChromaDB HTTP server für VectorMemory.
  # IS_PERSISTENT=TRUE: Index überlebt Container-Restart.
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  # ── LLM Agent + Ingest ───────────────────────────────────────────────────────
  # Llama-3.1-8B für QA-Agent und Graph-Triple-Extraktion (sequential, nie gleichzeitig).
  # Structured Output via Ollama JSON Schema (llama.cpp grammar, equivalent zu guided decoding).
  # Modelle werden nach Container-Start per `docker exec ollama-agent ollama pull` geladen.
  # OLLAMA_KEEP_ALIVE: Modell bleibt 10min im VRAM — bei 16GB VRAM reicht das für sequenziellen Betrieb.
  ollama-agent:
    image: ollama/ollama:latest
    container_name: ollama-agent
    ports:
      - "11434:11434"
    volumes:
      - ollama_agent_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── LLM Judge ────────────────────────────────────────────────────────────────
  # Qwen2.5-7B für LLM-as-Judge Evaluation.
  # Andere Model-Family als Agent → kein Self-Enhancement-Bias.
  # Läuft nur während Phase 4 (Evaluation) — nicht gleichzeitig mit ollama-agent aktiv.
  ollama-judge:
    image: ollama/ollama:latest
    container_name: ollama-judge
    ports:
      - "11435:11434"
    volumes:
      - ollama_judge_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_agent_models:
  ollama_judge_models:
