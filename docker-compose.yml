services:

  # ── Vector store ─────────────────────────────────────────────────────────────
  # ChromaDB HTTP server für VectorMemory.
  # IS_PERSISTENT=TRUE: Index überlebt Container-Restart.
  # Version gepinnt für Reproduzierbarkeit.
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  # ── LLM Agent + Ingest ───────────────────────────────────────────────────────
  # Llama-3.1-8B-Instruct für QA-Agent und Graph-Triple-Extraktion.
  # Guided Decoding via outlines erzwingt valides JSON bei der Extraktion.
  # Modell wird beim ersten Start automatisch von HuggingFace geladen (~8GB).
  # HF_TOKEN in .env erforderlich — Llama 3.1 ist ein gated Model.
  vllm-agent:
    image: vllm/vllm-openai:latest
    container_name: vllm-agent
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - vllm_agent_cache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    command: >
      --model meta-llama/Llama-3.1-8B-Instruct
      --guided-decoding-backend outlines
      --max-model-len 4096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host

  # ── LLM Judge ────────────────────────────────────────────────────────────────
  # Qwen2.5-7B-Instruct für LLM-as-Judge Evaluation.
  # Andere Model-Family als Agent → kein Self-Enhancement-Bias.
  # guided_choice erzwingt exakt CORRECT / PARTIAL / INCORRECT.
  # Modell wird beim ersten Start automatisch von HuggingFace geladen (~8GB).
  vllm-judge:
    image: vllm/vllm-openai:latest
    container_name: vllm-judge
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - vllm_judge_cache:/root/.cache/huggingface
    ports:
      - "8002:8000"
    command: >
      --model Qwen/Qwen2.5-7B-Instruct
      --guided-decoding-backend outlines
      --max-model-len 4096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host

volumes:
  chroma_data:
  vllm_agent_cache:
  vllm_judge_cache:
