services:

  # ── Vector store ─────────────────────────────────────────────────────────────
  # ChromaDB HTTP server für VectorMemory.
  # IS_PERSISTENT=TRUE: Index überlebt Container-Restart.
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: no

  # ── LLM Agent + Ingest ───────────────────────────────────────────────────────
  # Llama-3.1-8B für QA-Agent und Graph-Triple-Extraktion (sequential, nie gleichzeitig).
  # Structured Output via Ollama JSON Schema (llama.cpp grammar, equivalent zu guided decoding).
  # Modelle werden nach Container-Start per `docker exec ollama-agent ollama pull` geladen.
  # OLLAMA_KEEP_ALIVE: Modell bleibt 10min im VRAM — bei 16GB VRAM reicht das für sequenziellen Betrieb.
  ollama-agent:
    image: ollama/ollama:latest
    container_name: ollama-agent
    ports:
      - "11434:11434"
    volumes:
      - ollama_agent_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: no

  # ── LLM Judge ────────────────────────────────────────────────────────────────
  # Qwen2.5-14B für LLM-as-Judge Evaluation (Upgrade von 7B, 2026-05-25).
  # Andere Model-Family als Agent (Qwen vs. Llama) → kein Self-Enhancement-Bias.
  # Läuft nur in 04_evaluate.py — nie gleichzeitig mit ollama-agent.
  # OLLAMA_KEEP_ALIVE=0: Modell wird sofort nach letztem Call entladen.
  # Grund: 16GB VRAM — zwei 14B-Modelle gleichzeitig würden ~18GB brauchen (zu viel).
  # Mit KEEP_ALIVE=0 ist das Agent-Modell bereits entladen wenn der Judge startet.
  ollama-judge:
    image: ollama/ollama:latest
    container_name: ollama-judge
    ports:
      - "11435:11434"
    volumes:
      - ollama_judge_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: no

volumes:
  chroma_data:
  ollama_agent_models:
  ollama_judge_models:
