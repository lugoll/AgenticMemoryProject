services:

  # ── Vector store ─────────────────────────────────────────────────────────────
  # ChromaDB HTTP server für VectorMemory. IS_PERSISTENT=TRUE → Index überlebt Restart.
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: no

  # ── LLM Agent + Ingest ───────────────────────────────────────────────────────
  # QA-Agent und Graph-Triple-Extraktion (sequenziell, nie gleichzeitig mit dem Judge).
  # Modelle werden nach Container-Start per `docker exec ollama-agent ollama pull` geladen.
  ollama-agent:
    image: ollama/ollama:latest
    container_name: ollama-agent
    ports:
      - "11434:11434"
    volumes:
      - ollama_agent_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: no

  # ── LLM Judge ────────────────────────────────────────────────────────────────
  # LLM-as-Judge für 04_evaluate.py. Andere Model-Family als der Agent → kein
  # Self-Enhancement-Bias. Läuft nie gleichzeitig mit ollama-agent (VRAM-Limit).
  ollama-judge:
    image: ollama/ollama:latest
    container_name: ollama-judge
    ports:
      - "11435:11434"
    volumes:
      - ollama_judge_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=1m # Um unnötiges (ent-)laden in VRAM zu vermeiden
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: no

  # ── Knowledge Graph Store ────────────────────────────────────────────────────
  # Neo4j 5.x für die GraphMemory. Browser-UI: http://localhost:7474 (neo4j / password),
  # Bolt-Port 7687 für Python-Driver und LlamaIndex.
  neo4j:
    image: neo4j:5
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    restart: no

volumes:
  chroma_data:
  ollama_agent_models:
  ollama_judge_models:
  neo4j_data:
